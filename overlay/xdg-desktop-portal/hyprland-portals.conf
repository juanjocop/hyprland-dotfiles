# Portales XDG en la sesión de Hyprland.
#
# Copia de /usr/share/xdg-desktop-portal/hyprland-portals.conf MÁS una línea nuestra.
# Ojo: xdg-desktop-portal NO fusiona ficheros de config, usa el PRIMERO que encuentra
# (~/.config gana sobre /usr/share), así que hay que repetir el `default` del sistema
# o nos quedaríamos sin los portales de captura de pantalla, file chooser, etc.
[preferred]
default=hyprland;gtk

# El añadido: quién implementa el llavero (org.freedesktop.impl.portal.Secret). En Hyprland no
# lo servía NADIE — kwallet.portal viene marcado `UseIn=kde` y hyprland-portals.conf no lo mapea —
# así que la interfaz org.freedesktop.portal.Secret sencillamente no existía en la sesión.
#
# Esto NO es lo que arregla el login de Claude Desktop (eso es el --password-store del lanzador,
# ver aplicar.sh §8d): el safeStorage de Electron va por el os_crypt SÍNCRONO, que ni mira el
# portal. Verificado arrancando la app con el portal ya puesto y sin el flag → seguía en
# basic_text. Lo que sí arregla es el os_crypt ASÍNCRONO, que es por donde Chromium cifra las
# COOKIES: sin portal caía al esquema `v10`, ofuscación con clave fija, y ahora obtiene clave
# real del llavero. Se ve en ~/.config/Claude/Local State: os_crypt.portal.prev_init_success
# pasó de false a true en cuanto existió el portal.
#
# Se queda por eso y porque beneficia a TODA app Chromium/Electron de la máquina, no solo a
# Claude. Lo atiende kwallet, que en CachyOS ya está montado y se desbloquea en el login
# (ksecretd --pam-login).
org.freedesktop.impl.portal.Secret=kwallet
