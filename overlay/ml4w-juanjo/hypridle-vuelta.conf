# ─────────────────────────────────────────────────────────────────────────────
# hypridle-vuelta.conf — el DETECTOR DE VUELTA. NO es el hypridle de la sesión (ese lee
# ~/.config/hypr/hypridle.conf). Lo lanza idle-guard.sh SOLO mientras las pantallas están apagadas
# por inactividad, y lo para en cuanto vuelven. El porqué completo, en idle-guard.sh (bloque "El
# detector de vuelta") y en el README.
#
# Resumen: el `on-resume` del hypridle de la sesión SE PIERDE si un inhibidor (un navegador con
# vídeo o audio) se suelta estando ya inactivo: hypridle recrea sus notificaciones de idle y la
# nueva nunca recibe `resumed` (hyprwm/hypridle#208). Este ignora TODOS los inhibidores, así que no
# pasa nunca por ese código.
# ─────────────────────────────────────────────────────────────────────────────

general {
    ignore_dbus_inhibit = true      # ni intenta ser org.freedesktop.ScreenSaver (ya lo es el de la sesión)
    ignore_systemd_inhibit = true   # ni escucha el BlockInhibited de logind → onInhibit() no se llama jamás
    ignore_wayland_inhibit = true   # pide la notificación de "solo entrada": Hyprland no la toca por inhibidores
    inhibit_sleep = 0               # sin inhibidor de suspensión propio: eso es cosa del de la sesión
}

listener {
    timeout = 1                     # s: se da por inactivo al segundo de apagar (llevabas 11 min sin tocar nada)
    on-timeout = true               # NO QUITAR: con on-timeout vacío, hypridle se salta también el on-resume
    on-resume = $HOME/.config/ml4w-juanjo/scripts/idle-guard.sh accion pantallas-on detector
}
