# 51-salida-hdmi-dp2.conf — fija la salida HDMI/DP de la NVIDIA en el monitor QUE TIENE ALTAVOCES.
#
# SOBREMESA (cachyos-equipaso). La tarjeta de audio de la RTX 5070 Ti expone un puerto por
# conector, y cada puerto vive en un PERFIL distinto (solo uno activo a la vez):
#
#   output:hdmi-stereo         → hdmi-output-0 → DP-1 → KTC H27E6   (prioridad 5900, SIN altavoces)
#   output:hdmi-stereo-extra1  → hdmi-output-1 → DP-2 → ASUS MG278  (prioridad 5700, CON altavoces)
#
# Por qué se volvía solo al DP-1: WirePlumber elige perfil en tres pasos
# (device/find-stored-profile → device/find-preferred-profile → device/find-best-profile).
# El primero solo vale si el perfil guardado está `available`; si el ASUS no está listo —arranque
# en frío, o la caída de enlace DP de estos monitores al dormirse (ver issue #1 / README)— ese paso
# se salta y manda `find-best-profile`, que coge el de MAYOR PRIORIDAD disponible: el DP-1. Y ahí
# se queda. El fichero de estado (~/.local/state/wireplumber/default-profile) no basta.
#
# Esta regla rellena el paso intermedio: pide extra1 POR NOMBRE, sin mirar disponibilidad, así que
# gana al `find-best-profile` pase lo que pase con el enlace DP.
#
# Multi-equipo: casa por `device.product.name`, que es el de la GB203 (RTX 5070 Ti). En el portátil
# (GTX 1060) no casa nada y la regla es un no-op. No usamos la ruta PCI a propósito: cambia entre
# máquinas y no distingue nada que el nombre del producto no distinga ya.
device.profile.priority.rules = [
  {
    matches = [
      {
        device.product.name = "GB203 High Definition Audio Controller"
      }
    ]
    actions = {
      update-props = {
        priorities = [ "output:hdmi-stereo-extra1" ]
      }
    }
  }
]
