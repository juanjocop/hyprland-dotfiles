# ─────────────────────────────────────────────────────────────────────────────
# Copia de la de ML4W con UN solo cambio: los dos encendidos de pantalla (el de después de
# suspender y el del listener de 11 min) pasan por despertar-pantallas.sh en vez de disparar
# `dpms enable` a pelo.
#
# Motivo: el disparo único y a ciegas dejaba la pantalla en NEGRO tras suspender en el
# sobremesa. No era el crash de aquamarine #337 (ese sí está arreglado en 0.14.0) sino un
# segundo fallo: los outputs se quedan deshabilitados y nadie los reenciende. El script espera
# a que la sesión de logind esté activa y CICLA el dpms (apagar + encender) con reintentos.
# El porqué completo, en la cabecera del script y en la issue #1 del repo del overlay.
#
# El resto del fichero es idéntico al de ML4W; check.sh vigila la deriva a 3 estados.
# ─────────────────────────────────────────────────────────────────────────────

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    # lock_cmd = playerctl --all-players pause && pidof hyprlock || hyprlock  # pause all system audio and avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = $HOME/.config/ml4w-juanjo/scripts/despertar-pantallas.sh   # encendido robusto: espera sesión activa + ciclo de dpms con reintentos.
}

listener {
    timeout = 480                                # 8min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
# listener { 
#     timeout = 480                                          # 8min.
#     on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
#     on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
# }

listener {
    timeout = 600                                 # 10min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 660                                                     # 11min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'                            # screen off when timeout has passed
    on-resume = $HOME/.config/ml4w-juanjo/scripts/despertar-pantallas.sh && brightnessctl -r       # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1800                                # 30min
    on-timeout = systemctl suspend                # suspend pc
}
