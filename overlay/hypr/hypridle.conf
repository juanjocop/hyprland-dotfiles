# ─────────────────────────────────────────────────────────────────────────────
# Copia de la de ML4W con DOS cambios. Los timeouts, el atenuado y los comentarios en inglés son
# los de ML4W tal cual; check.sh vigila la deriva a 3 estados.
#
# 1. ENCENDIDO ROBUSTO AL REANUDAR (after_sleep_cmd). El disparo único y a ciegas de `dpms enable`
#    dejaba la pantalla en NEGRO tras suspender en el sobremesa. No era el crash de aquamarine
#    #337 (ese sí está arreglado en 0.14.0) sino un segundo fallo: los outputs se quedan
#    deshabilitados y nadie los reenciende. despertar-pantallas.sh espera a que la sesión de
#    logind esté activa y CICLA el dpms (apagar + encender) con reintentos. El porqué completo,
#    en la cabecera del script y en la issue #1 del repo del overlay.
#
# 2. LAS ACCIONES DE INACTIVIDAD PASAN POR idle-guard.sh (bloquear, apagar pantallas, suspender).
#    Así se pueden desactivar por separado desde el botón de la barra, sin tocar este fichero ni
#    reiniciar el daemon: el guardián mira una bandera EN EL MOMENTO DEL DISPARO y decide si
#    ejecuta la acción o la ignora. Hace falta porque hypridle 0.1.8 no tiene IPC y los
#    inhibidores estándar son todo-o-nada. El porqué completo, en la cabecera del guardián.
#    Ojo: el `on-resume` del listener de 11 min también pasa por él — si las pantallas nunca se
#    apagaron, ciclar el dpms provocaría un parpadeo al volver al equipo.
# ─────────────────────────────────────────────────────────────────────────────

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    # lock_cmd = playerctl --all-players pause && pidof hyprlock || hyprlock  # pause all system audio and avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = $HOME/.config/ml4w-juanjo/scripts/despertar-pantallas.sh   # encendido robusto: espera sesión activa + ciclo de dpms con reintentos.
}

listener {
    timeout = 480                                # 8min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
# listener { 
#     timeout = 480                                          # 8min.
#     on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
#     on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
# }

listener {
    timeout = 600                                 # 10min
    on-timeout = $HOME/.config/ml4w-juanjo/scripts/idle-guard.sh accion bloquear   # lock screen when timeout has passed (vía guardián: se puede desactivar desde la barra)
}

listener {
    timeout = 660                                                     # 11min
    on-timeout = $HOME/.config/ml4w-juanjo/scripts/idle-guard.sh accion pantallas-off   # screen off when timeout has passed (vía guardián)
    on-resume = $HOME/.config/ml4w-juanjo/scripts/idle-guard.sh accion pantallas-on     # screen on when activity is detected after timeout has fired (vía guardián: brightnessctl -r + despertar-pantallas.sh solo si de verdad se apagaron).
}

listener {
    timeout = 1800                                # 30min
    on-timeout = $HOME/.config/ml4w-juanjo/scripts/idle-guard.sh accion suspender   # suspend pc (vía guardián: se puede desactivar desde la barra)
}
